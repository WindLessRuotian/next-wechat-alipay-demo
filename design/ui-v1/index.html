function qr(){
// Deliberately non-payment artwork, labelled DEMO; never encode a provider URL.
let r="";const size=29,corner=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="white"/><rect x="${x+2}" y="${y+2}" width="3" height="3"/>`;
for(let y=0;y<size;y++)for(let x=0;x<size;x++){if((x<8&&y<8)||(x>20&&y<8)||(x<8&&y>20))continue;if(((x*19+y*13+x*y*7)%17)<8)r+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}
return `<svg viewBox="-1 -1 31 31" role="img" aria-label="不可支付的二维码设计示意" shape-rendering="crispEdges" fill="#1d2c44">${r}${corner(0,0)}${corner(22,0)}${corner(0,22)}</svg><span class="qr-seal">DEMO</span>`;

 ["等待支付","pending","clock","amber","保留二维码与倒计时，显示服务端同步中；不在客户端宣布支付成功。","预览待支付","pending"],

function go(screen,extra={}){

function action(a){
if(a==="close-modal")return closeModal();
if(a==="about")return dialog("关于这个设计原型","这是现有 Next.js 微信 / 支付宝项目的独立高保真设计。页面使用虚拟身份和固定示例订单；所有按钮仅用于预览，不调用项目 API，不产生真实登录、会话或扣款。");
if(a==="privacy")return dialog("数据使用说明","此原型不采集你的微信、支付宝账号或支付信息。实际产品在授权后仅保存渠道身份、昵称、头像及本地订单关系；敏感令牌与签名应由服务端处理。正式上线前仍需补齐真实隐私政策与主体信息。");
if(a==="logout")return dialog("退出当前账号？","退出后需要重新授权登录。当前未完成订单仍会保留在你的账号下。",[["暂不退出","close-modal"],["确认退出","confirm-logout","primary"]],"logout");
if(a==="confirm-logout"){closeModal();go("login");return}
if(a.startsWith("login-"))return go("authorize",{provider:a.slice(6)});
if(a==="link-account")return go("authorize",{provider:"alipay",intent:"link"});
if(a==="allow"){const linked=qs().get("intent")==="link";if(linked)linkedAccount=true;go("dashboard");return toast(linked?"已预览关联成功。原型不写入真实账号数据。":"模拟授权预览完成，已进入示例控制台。")}
if(a==="deny"){go("login");return toast("已取消授权，可以重新选择登录方式。")}
if(a==="pay")return go(provider==="wechat"?"pending":"bridge");
if(a==="cancel")return dialog("确认取消这笔订单？","取消后这笔订单将不能继续支付。如需购买，请重新创建订单；最终关闭结果仍以服务端和渠道确认为准。",[["继续支付","close-modal"],["确认取消","confirm-cancel","danger"]],"info");
if(a==="confirm-cancel"){closeModal();return go("closed")}
if(a==="replay")return dialog("重复通知处理示意","实际业务应以渠道事件 ID 保证幂等：同一通知再次到达，不重复变更订单或记账。本原型没有发送任何通知。",[["知道了","close-modal","primary"]],"shield");
if(a==="refresh-orders")return toast("示例订单已刷新。原型不请求业务接口。");
if(a==="reset-filters"){filter="all";channelFilter="all";search="";page=1;return render()}
if(a==="network")return dialog("网络连接暂时中断","尚未取得新的服务端结果，订单仍保留待支付状态。恢复连接后重新查询；如果渠道显示已扣款，请勿重复付款。",[["稍后查看","close-modal"],["重新查询（示意）","retry","primary"]],"cloud");
if(a==="retry"){closeModal();return toast("已预览重新查询，订单仍以服务端结果为准。")}
if(a==="oauth-error")return dialog("本次授权已失效","授权已过期、被取消或校验未通过，请从登录入口重新发起授权。此时不会创建登录会话。",[["返回","close-modal"],["重新登录","restart-login","primary"]],"shield");
if(a==="restart-login"){closeModal();return go("login")}
if(a==="link-error")return dialog("这个身份已关联其他账号","为保护订单归属，不能自动合并两个账号。请使用其他身份进行关联，或退出后使用该身份登录。",[["我知道了","close-modal","primary"]],"link");
}
document.addEventListener("click",e=>{
const target=e.target.closest("button,a");if(!target)return;
if(target.dataset.go){e.preventDefault();return go(target.dataset.go)}
if(target.dataset.action)return action(target.dataset.action);
if(target.dataset.provider){provider=target.dataset.provider;return render()}
if(target.dataset.filter){filter=target.dataset.filter;page=1;return render()}
if(target.dataset.page){page=Math.max(1,Math.min(Math.ceil(filtered().length/6)||1,page+Number(target.dataset.page)));return render()}
if(target.dataset.order){return target.dataset.order==="pending"?go("pending"):go("success",{state:target.dataset.order})}
if(target.dataset.preview){
const p=target.dataset.preview;
if(["network","oauth-error","link-error"].includes(p))return action(p);
if(p==="cancel-modal")return action("cancel");
if(p==="empty"){filter="all";channelFilter="all";search="NO-MATCH";page=1;return go("orders")}
return go(p)
}
});
document.addEventListener("change",e=>{if(e.target.id==="screen-select")go(e.target.value);if(e.target.id==="channel-filter"){channelFilter=e.target.value;page=1;render()}});
document.addEventListener("input",e=>{if(e.target.id!=="order-search")return;search=e.target.value;page=1;const pos=e.target.selectionStart;render();const input=document.getElementById("order-search");input.focus();input.setSelectionRange(pos,pos)});
window.addEventListener("resize",fitFrames);window.addEventListener("popstate",render);
render();
</script>
</body>
</html>
